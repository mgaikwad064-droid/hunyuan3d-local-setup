<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Adaptive Stream Player Test</title>
    
    <!-- Video.js Stylesheet CDN -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f12;
            color: #f0f6fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .video-container {
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }
        /* Ensure Video.js fills container responsively */
        .video-js {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }
        .badge {
            margin-top: 1rem;
            display: inline-block;
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 139, 253, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Adaptive HLS Multi-Bitrate Stream Test</h1>
        
        <div class="video-container">
            <video
                id="adaptive-player"
                class="video-js vjs-big-play-centered vjs-theme-city"
                controls
                preload="auto"
                data-setup='{}'
            >
                <!-- Point to your generated master HLS playlist -->
                <source src="./hls_streaming_package/master.m3u8" type="application/x-mpegURL" />
                <p class="vjs-no-js">
                    To view this video please enable JavaScript, and consider upgrading to a
                    web browser that <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
                </p>
            </video>
        </div>
        
        <div class="badge">Streaming Source: <code>./hls_streaming_package/master.m3u8</code></div>
    </div>

    <!-- Video.js Script CDN -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

</body>
</html>
